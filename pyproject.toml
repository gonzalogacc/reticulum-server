[project]
name = "fast-ret"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lxmf>=1.0.1",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "rns>=1.3.5",
    "watchfiles>=1.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
]

[tool.ruff]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[[tool.mypy.overrides]]
module = "RNS.*"
ignore_missing_imports = true